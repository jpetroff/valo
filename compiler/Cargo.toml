# Manifest of the compiler crate: lexer, parser, codegen (library
# `valo_compiler`) and the `valo` command-line tool (src/main.rs).

[package]
name = "valo-compiler"
description = "Lexer, parser and bytecode compiler for the valo language, plus the `valo` CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "valo_compiler"
path = "src/lib.rs"

[[bin]]
name = "valo"
path = "src/main.rs"

[dependencies]
ariadne.workspace = true
clap.workspace = true
thiserror.workspace = true
valo-vm.workspace = true

# Libraries used only by tests: insta (snapshots), pretty_assertions (diffs),
# proptest (random inputs).
[dev-dependencies]
insta.workspace = true
pretty_assertions.workspace = true
proptest.workspace = true

[lints]
workspace = true
